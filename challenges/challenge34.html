<div class="wrapper">
    <div></div>
    <div></div>
    <div></div>
</div>

<style>
    body { margin: 0;}
    .wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #007065;
    }
    .wrapper > div {
        position: absolute;
        width: 250px;
        height: 100px;
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }
    .wrapper > div:nth-child(1) {
        background: #00A79D;
        transform: translate(0, 50px);
    }
    .wrapper > div:nth-child(2) {
        background: #F5C181;
    }
    .wrapper > div:nth-child(3) {
        background: #FFEECF;
        transform: translate(0, -50px);
    }
</style>
